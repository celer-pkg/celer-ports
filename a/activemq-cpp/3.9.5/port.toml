
[package]
  url = "https://archive.apache.org/dist/activemq/activemq-cpp/3.9.5/activemq-cpp-library-3.9.5-src.tar.gz"
  ref = "3.9.5"

[[build_configs]]
  build_system = "makefiles"
  system_name_except = "windows"
  dependencies = ["apr@1.7.6"]
  options = ["--host=${HOST}", "--with-apr=${STAGING_DIR}"]
  post_install_linux = [
    # 去掉 .pc / activemqcpp-config 里指向临时 staging 的绝对路径
    "sed -i -E 's#[^[:space:]]*tmp/staging[^[:space:]]*##g' ${PACKAGE_DIR}/lib/pkgconfig/activemq-cpp.pc ${PACKAGE_DIR}/bin/activemqcpp-config",
    # 让 activemqcpp-config 的 prefix 也可重定位
    "sed -i 's|^prefix=.*|prefix=$(dirname $(dirname \"$0\"))|' ${PACKAGE_DIR}/bin/activemqcpp-config",
  ]