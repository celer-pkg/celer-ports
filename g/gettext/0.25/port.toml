[package]
  url = "https://ftp.gnu.org/gnu/gettext/gettext-0.25.tar.xz"
  checksum = "05240b29f5b0f422e5a4ef8e9b5f76d8fa059cc057693d2723cdb76f36a88ab0"
  ref = "v0.25"
  build_tool = true

[[build_configs]]
  build_system = "makefiles"
  dependencies = ["gnulib@1.0"]
  dev_dependencies = ["automake@1.18"]
  envs = [
    "GNULIB_SRCDIR=${BUILDTREES_DIR}/gnulib@master/src",
    "AUTOCONF=:",   # Avoid regenerating configure.ac
    "AUTOMAKE=:",   # Avoid regenerating Makefile.in
    "ACLOCAL=:",    # Avoid regenerating aclocal.m4
    "AUTOHEADER=:", # Avoid regenerating config.h.in
    "MAKEINFO=:",   # Avoid regenerating *.info
  ]
  options = [
    "--disable-java",
    "--disable-d",
    "--disable-csharp",
    "--disable-nls",
    "--disable-curses",
    "--disable-openmp",
    "--disable-acl",
    "--disable-xattr",
    "--without-emacs",
    "--without-git",
  ]
