[package]
  url = "https://ftp.gnu.org/gnu/libtool/libtool-2.5.4.tar.xz"
  checksum = "f81f5860666b0bc7d84baddefa60d1cb9fa6fceb2398cc3baca6afaa60266675"
  ref = "2.5.4"
  depth = 1
  build_tool = true

[[build_configs]]
  system_name = "linux"
  build_system = "makefiles"
  dependencies = ["m4@1.4.19"]
  options = ["--disable-nls"]
  envs = [
    "AUTOCONF=:",   # Avoid regenerating configure.ac
    "AUTOMAKE=:",   # Avoid regenerating Makefile.in
    "ACLOCAL=:",    # Avoid regenerating aclocal.m4
    "AUTOHEADER=:", # Avoid regenerating config.h.in
    "MAKEINFO=:",   # Avoid regenerating *.info
  ]
