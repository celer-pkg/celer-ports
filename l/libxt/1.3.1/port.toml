    "libx11@1.8.11",
    "libxext@1.3.6",
    "libsm@1.2.5",
    "xorgproto@2024.1",
  ]
  dev_dependencies = [
    "macros@1.20.2",
    "pkgconf@2.4.3",
  ]
  options = ["--host=${HOST}"]